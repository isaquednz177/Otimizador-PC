# Roda os testes num Windows do GitHub a cada envio e em cada pull request.
# Os testes usam um Windows falso (tests/falso.py): nada é mudado na máquina.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Confere se tudo compila
        run: python -m compileall -q otimizador_pc main.py tests
      - name: Testes
        run: python -m unittest discover -s tests -v
